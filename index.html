<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--amber:#F2A900;--dark:#14202B;--cream:#FFF8E6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--amber);color:var(--dark);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:28px 20px 32px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Alexandria';font-weight:800;font-size:26px}
.logo{width:40px;height:40px;background:var(--dark);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);display:grid;place-items:center;color:var(--amber);font-size:22px}
h1{font-family:'Alexandria';font-weight:800;font-size:40px;line-height:1.25}
h1 span{display:block;font-size:28px;margin-top:6px}
.card{background:var(--cream);border-radius:20px;padding:18px 18px 8px}
.step{display:flex;gap:12px;align-items:center;padding-bottom:14px}
.n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--dark);color:var(--amber);font-family:'Alexandria';font-weight:800;display:grid;place-items:center}
.step b{font-weight:600;font-size:18px;line-height:1.5}
.cta{display:block;text-align:center;background:var(--dark);color:var(--amber);text-decoration:none;font-family:'Alexandria';font-weight:800;font-size:24px;padding:20px;border-radius:999px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.cta:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.note{text-align:center;font-size:14px;opacity:.8}
footer{text-align:center;font-size:12px;opacity:.7;margin-top:auto}
</style>
</head>
<body>
<main>
  <div class="brand"><div class="logo">‹</div>غيار</div>
  <h1>قطع غيار سيارتك بأفضل سعر<span>والسعر يجيك خلال ساعتين</span></h1>
  <div class="card">
    <div class="step"><div class="n">١</div><b>ارسل لنا وش القطعة اللي تبيها</b></div>
    <div class="step"><div class="n">٢</div><b>نجيب لك القطعة بأسرع وقت وأفضل من سعر السوق</b></div>
    <div class="step"><div class="n">٣</div><b>إذا ناسبك تدفع، والتوصيل مجاني</b></div>
  </div>
  <a id="go" class="cta" href="https://wa.me/966533527004">اطلب سعرك الحين</a>

  <footer>غيار — خدمة توفير قطع غيار السيارات في الرياض</footer>
</main>
<script>
(function(){
  var c=(new URLSearchParams(location.search).get('c')||'SNAP').replace(/[^A-Za-z0-9]/g,'').slice(0,8)||'SNAP';
  var t='السلام عليكم، أبغى قطعة لسيارتي ['+c+']';
  document.getElementById('go').href='https://wa.me/966533527004?text='+encodeURIComponent(t);
})();
</script>
